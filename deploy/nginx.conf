upstream api {
    server api1:3001;
    server api2:3001;
}
server {
    listen 80;
    # The voice upload route accepts up to 5 MB (raw audio); the API enforces the real limits (100 KB JSON, 5 MB voice).
    client_max_body_size 6m;
    location / {
        proxy_pass http://api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_next_upstream error timeout http_503;
    }
}
