<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Today - One Thing At A Time</title>
<meta name="viewport" content="width=390">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html{background:#111}
body{width:390px;height:844px;overflow:hidden;position:relative;background:#E05555;color:#fff;font-family:'Space Grotesk',system-ui,sans-serif}
.mono{font-family:'JetBrains Mono',ui-monospace,monospace}
.scrim{position:absolute;inset:0;background:linear-gradient(to bottom,rgba(0,0,0,.28) 0,rgba(0,0,0,0) 18%,rgba(0,0,0,0) 38%,rgba(20,4,4,.62) 66%,rgba(20,4,4,.86) 100%)}
.prog{position:absolute;top:12px;left:16px;right:16px;display:flex;gap:4px}
.prog i{flex:1;height:3px;border-radius:2px;background:rgba(255,255,255,.35)}
.prog i.on{background:#fff}
.top{position:absolute;top:28px;left:16px;right:16px;font-size:12px;letter-spacing:.12em;font-weight:700;text-shadow:0 1px 2px rgba(0,0,0,.4)}
.top span{font-weight:500;opacity:.92}
.rail{position:absolute;right:12px;bottom:224px;width:64px;display:flex;flex-direction:column;gap:20px;align-items:center}
.btn{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.btn b{width:56px;height:56px;border-radius:50%;background:rgba(20,4,4,.55);border:2px solid #fff;display:grid;place-items:center}
.btn.main b{background:#fff}
.btn svg{width:26px;height:26px;fill:none;stroke:#fff;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.btn.main svg{stroke:#B03A3A}
.info{position:absolute;left:16px;right:96px;bottom:104px}
.kick{font-size:12px;font-weight:700;letter-spacing:.14em;margin-bottom:8px}
h1{font-size:44px;line-height:1;font-weight:700;letter-spacing:-.02em;margin-bottom:10px}
.det{font-size:16px;line-height:1.35;margin-bottom:14px}
.row{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.rew{font-size:15px;font-weight:700;background:#fff;color:#8E2424;padding:4px 10px;border-radius:6px}
.due{font-size:13px;font-weight:700;color:#FFC24D}
.sys{margin:14px 0 10px;padding-left:10px;border-left:2px solid #fff;font-size:15px;line-height:1.35}
.sys small{display:block;font-size:11px;letter-spacing:.14em;opacity:.8;margin-bottom:2px}
.hint{font-size:12px;opacity:.88}
nav{position:absolute;left:0;right:0;bottom:0;height:80px;background:#140808;display:grid;grid-template-columns:repeat(5,1fr);padding-top:10px;text-align:center;font-size:12px;font-weight:500;color:#C9BDBD}
nav div{display:flex;flex-direction:column;align-items:center;gap:4px}
nav em{width:64px;height:32px;border-radius:16px;display:grid;place-items:center}
nav svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
nav .act{color:#fff;font-weight:700}
nav .act em{background:#E05555}
</style></head><body>
<div class="scrim"></div>
<div class="prog"><i></i><i class="on"></i><i></i><i></i></div>
<div class="top mono">SYSTEM // SELF <span>· Day 12 · Rank E</span></div>

<div class="rail">
 <div class="btn main"><b><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7"/></svg></b>Complete</div>
 <div class="btn"><b><svg viewBox="0 0 24 24"><path d="M12 11v6M12 7.5v.01"/></svg></b>Briefing</div>
 <div class="btn"><b><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></b>Refuse</div>
</div>

<div class="info">
 <div class="kick mono">QUEST 1 OF 3 · BODY</div>
 <h1>Home session</h1>
 <p class="det">25 min bodyweight. No equipment.</p>
 <div class="row"><span class="rew mono">+2.5 BODY</span><span class="due mono">Due 21:00 · expires in 2h</span></div>
 <div class="sys"><small class="mono">THE SYSTEM</small>You skipped this twice. Not today.</div>
 <div class="hint mono">Swipe up: Deep work · MIND +2.0</div>
</div>

<nav>
 <div class="act"><em><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="2.5"/></svg></em>Today</div>
 <div><em><svg viewBox="0 0 24 24"><path d="M3 9v6M6 7v10M18 7v10M21 9v6M6 12h12"/></svg></em>Gym</div>
 <div><em><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></em>Log</div>
 <div><em><svg viewBox="0 0 24 24"><path d="M12 3l8 4v5c0 4.5-3.5 8-8 9-4.5-1-8-4.5-8-9V7z"/></svg></em>Arena</div>
 <div><em><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/></svg></em>You</div>
</nav>
</body></html>
