<!doctype html><html lang="en"><head><title>System Self</title>
<meta charset="utf-8"><meta name="viewport" content="width=390">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Noto+Sans:wght@400;500&display=swap">
<style>
:root{--bg:#07060B;--bg2:#0E0C15;--panel:rgba(38,28,64,0.55);--frame:rgba(176,140,255,0.55);--accent:#A879FF;--on-accent:#0B0812;--text:#F1ECF7;--text2:#B5ACC4;--warn:#F2B544;--body:#E8604C;--mind:#4F8FE0;--wealth:#2FA36B;--social:#D4A62A;--discipline:#C77DDB;--hair:color-mix(in srgb,var(--frame) 30%,transparent);--d:"Chakra Petch",sans-serif;--n:"Noto Sans",Roboto,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--bg)}
body{width:390px;height:844px;overflow:hidden;position:relative;background:linear-gradient(180deg,var(--bg2) 0%,var(--bg) 45%);color:var(--text);font:400 15px/24px var(--n)}
.s12{font-size:12px;line-height:16px}.s20{font:600 20px/28px var(--d)}.hero{font:700 56px/64px var(--d);text-shadow:0 0 24px color-mix(in srgb,var(--accent) 45%,transparent)}
.sec{color:var(--text2)}.cap{font:600 12px/16px var(--d);letter-spacing:.2em;text-transform:uppercase}
.main{position:absolute;left:24px;right:24px;top:48px;bottom:96px}
.win{position:relative;background:var(--panel);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);clip-path:polygon(12px 0,calc(100% - 12px) 0,100% 12px,100% calc(100% - 12px),calc(100% - 12px) 100%,12px 100%,0 calc(100% - 12px),0 12px)}
.win::before{content:"";position:absolute;inset:0;pointer-events:none;background:var(--frame);clip-path:polygon(evenodd,12px 0,calc(100% - 12px) 0,100% 12px,100% calc(100% - 12px),calc(100% - 12px) 100%,12px 100%,0 calc(100% - 12px),0 12px,12px 0,12.4px 1px,1px 12.4px,1px calc(100% - 12.4px),12.4px calc(100% - 1px),calc(100% - 12.4px) calc(100% - 1px),calc(100% - 1px) calc(100% - 12.4px),calc(100% - 1px) 12.4px,calc(100% - 12.4px) 1px,12.4px 1px)}
.win>.hd{text-align:center;color:var(--accent);padding-top:16px}
.btn{display:flex;align-items:center;justify-content:center;height:56px;background:var(--accent);color:var(--on-accent);font:700 15px/24px var(--d);letter-spacing:.2em;border-radius:4px}
.tick{width:4px;height:32px;border-radius:2px;flex:none}
nav{position:absolute;left:0;right:0;bottom:0;height:80px;background:var(--bg2);border-top:1px solid var(--hair);display:flex;align-items:flex-end;padding-bottom:10px}
nav a{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--text2);font:500 12px/16px var(--n)}
nav .pi{width:64px;height:32px;border-radius:16px;display:flex;align-items:center;justify-content:center}
nav svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav .on{color:var(--text)}nav .on .pi{background:color-mix(in srgb,var(--accent) 28%,transparent);color:var(--accent)}
nav .log{color:var(--text)}nav .log .pi{width:48px;height:48px;border-radius:50%;background:var(--accent);color:var(--on-accent)}
.seg{display:flex;margin-top:16px;height:48px;border:1px solid var(--hair);border-radius:24px;padding:4px;background:color-mix(in srgb,var(--bg2) 80%,transparent)}
.seg span{flex:1;display:flex;align-items:center;justify-content:center;border-radius:20px;color:var(--text2);font-weight:500}
.seg .sel{background:var(--accent);color:var(--on-accent)}
.q{display:flex;align-items:center;gap:16px;height:72px;border-bottom:1px solid var(--hair)}
.q>div{flex:1}
.ck{width:48px;height:48px;display:flex;align-items:center;justify-content:center;margin-right:-8px}
.ck i{width:24px;height:24px;border:2px solid var(--text2);border-radius:50%}
</style></head><body>
<div class="main">
<div class="s20" style="height:48px;display:flex;align-items:center">Quests</div>
<div class="seg"><span class="sel">Today</span><span>This week</span><span>Arcs</span></div>
<div style="margin-top:16px;border-top:1px solid var(--hair)">
<div class="q"><i class="tick" style="background:var(--body)"></i><div><div>Home session — 25 min</div><div class="s12 sec">+2.5 BODY · due 21:00</div></div><span style="color:var(--warn);font-weight:500">2h</span></div>
<div class="q"><i class="tick" style="background:var(--mind)"></i><div><div>Deep work — 60 min, no phone</div><div class="s12 sec">+2.0 MIND</div></div><span class="ck"><i></i></span></div>
<div class="q"><i class="tick" style="background:var(--wealth)"></i><div><div>Review expenses — 3 transactions</div><div class="s12 sec">+1.5 WEALTH</div></div><span class="ck"><i></i></span></div>
</div>
<div class="win" style="margin-top:32px;padding:0 24px;height:96px">
<div class="hd cap">[ Bonus ]</div>
<div class="sec" style="margin-top:8px;text-align:center">Unlocks after 2 completions.</div></div>
</div>
<nav>
<a class=""><span class="pi"><svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/></svg></span>Today</a>
<a class="on"><span class="pi"><svg viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11M4 6h1M4 12h1M4 18h1"/></svg></span>Quests</a>
<a class="log"><span class="pi"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></span>Log</a>
<a class=""><span class="pi"><svg viewBox="0 0 24 24"><path d="M12 3l8 3v6c0 4.5-3.4 7.8-8 9-4.6-1.2-8-4.5-8-9V6z"/></svg></span>Arena</a>
<a class=""><span class="pi"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-7 8-7s8 3 8 7"/></svg></span>Status</a>
</nav></body></html>
