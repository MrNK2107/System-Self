<!doctype html><html lang="en"><head><title>System Self</title>
<meta charset="utf-8"><meta name="viewport" content="width=390">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Noto+Sans:wght@400;500&display=swap">
<style>
:root{--bg:#0A0907;--bg2:#13110D;--panel:rgba(52,44,26,0.55);--frame:rgba(214,178,98,0.6);--accent:#D9B25F;--on-accent:#120F08;--text:#F2EEE6;--text2:#B9B0A0;--warn:#F2B544;--body:#E8604C;--mind:#4F8FE0;--wealth:#2FA36B;--social:#C77DDB;--discipline:#8E9BB0;--hair:color-mix(in srgb,var(--frame) 30%,transparent);--d:"Chakra Petch",sans-serif;--n:"Noto Sans",Roboto,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--bg)}
body{width:390px;height:844px;overflow:hidden;position:relative;background:linear-gradient(180deg,var(--bg2) 0%,var(--bg) 45%);color:var(--text);font:400 15px/24px var(--n)}
.s12{font-size:12px;line-height:16px}.s20{font:600 20px/28px var(--d)}.hero{font:700 56px/64px var(--d);text-shadow:0 0 24px color-mix(in srgb,var(--accent) 45%,transparent)}
.sec{color:var(--text2)}.cap{font:600 12px/16px var(--d);letter-spacing:.2em;text-transform:uppercase}
.main{position:absolute;left:24px;right:24px;top:48px;bottom:96px}
.win{position:relative;background:var(--panel);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);clip-path:polygon(12px 0,calc(100% - 12px) 0,100% 12px,100% calc(100% - 12px),calc(100% - 12px) 100%,12px 100%,0 calc(100% - 12px),0 12px)}
.win::before{content:"";position:absolute;inset:0;pointer-events:none;background:var(--frame);clip-path:polygon(evenodd,12px 0,calc(100% - 12px) 0,100% 12px,100% calc(100% - 12px),calc(100% - 12px) 100%,12px 100%,0 calc(100% - 12px),0 12px,12px 0,12.4px 1px,1px 12.4px,1px calc(100% - 12.4px),12.4px calc(100% - 1px),calc(100% - 12.4px) calc(100% - 1px),calc(100% - 1px) calc(100% - 12.4px),calc(100% - 1px) 12.4px,calc(100% - 12.4px) 1px,12.4px 1px)}
.win>.hd{text-align:center;color:var(--accent);padding-top:16px}
.btn{display:flex;align-items:center;justify-content:center;height:56px;background:var(--accent);color:var(--on-accent);font:700 15px/24px var(--d);letter-spacing:.2em;border-radius:4px}
.tick{width:4px;height:32px;border-radius:2px;flex:none}
nav{position:absolute;left:0;right:0;bottom:0;height:80px;background:var(--bg2);border-top:1px solid var(--hair);display:flex;align-items:flex-end;padding-bottom:10px}
nav a{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--text2);font:500 12px/16px var(--n)}
nav .pi{width:64px;height:32px;border-radius:16px;display:flex;align-items:center;justify-content:center}
nav svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav .on{color:var(--text)}nav .on .pi{background:color-mix(in srgb,var(--accent) 28%,transparent);color:var(--accent)}
nav .log{color:var(--text)}nav .log .pi{width:48px;height:48px;border-radius:50%;background:var(--accent);color:var(--on-accent)}
.gear{position:absolute;top:0;right:0;width:48px;height:48px;display:flex;align-items:center;justify-content:center;color:var(--text2)}
.gear svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.main{top:8px}
.info{display:flex;justify-content:space-between;height:24px;align-items:center}
.hex{position:relative;width:132px;height:144px;margin:16px auto 0}
.hex svg{position:absolute;inset:0}
.hex .hero{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:110px;line-height:120px;padding-bottom:4px}
.st{display:flex;align-items:center;height:48px;gap:16px;border-top:1px solid var(--hair)}
.st b{flex:1;font:600 15px/24px var(--d);letter-spacing:.14em}
.st .v{font:600 20px/28px var(--d);width:56px;text-align:right}
.st .dl{width:40px;text-align:right;color:var(--text2)}
.st .ch{color:var(--text2);font:400 20px/28px var(--d)}
</style></head><body>
<div class="main">
<div class="gear"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/></svg></div>
<div class="win" style="margin-top:56px;height:calc(100% - 56px);padding:0 24px">
<div class="hd cap">[ Status ]</div>
<div style="margin-top:16px">
<div class="info"><span class="s12 sec">NAME</span><span>player_zero</span></div>
<div class="info"><span class="s12 sec">JOB</span><span>Student</span></div>
<div class="info"><span class="s12 sec">TITLE</span><span class="s12 sec">The One Who Returned</span></div></div>
<div class="hex"><svg viewBox="0 0 132 144"><polygon points="66,3 125,37 125,107 66,141 7,107 7,37" fill="color-mix(in srgb,var(--accent) 8%,transparent)" stroke="var(--accent)" stroke-width="1.5"/><polygon points="66,12 117,41 117,103 66,132 15,103 15,41" fill="none" stroke="var(--frame)"/></svg><span class="hero">E</span></div>
<div style="text-align:center;margin-top:8px"><span class="s20">RANK E · 23.4</span></div>
<div style="margin:8px auto 0;width:160px;height:2px;background:var(--hair)"><div style="width:57%;height:2px;background:var(--accent)"></div></div>
<div class="s12 sec" style="text-align:center;margin-top:4px">2.6 to D</div>
<div style="margin-top:16px">
<div class="st"><i class="tick" style="background:var(--body)"></i><b>BODY</b><span class="v">31.2</span><span class="s12 dl">+1.4</span><span class="ch">›</span></div>
<div class="st"><i class="tick" style="background:var(--mind)"></i><b>MIND</b><span class="v">24.0</span><span class="s12 dl">+0.2</span><span class="ch">›</span></div>
<div class="st"><i class="tick" style="background:var(--wealth)"></i><b>WEALTH</b><span class="v">18.5</span><span class="s12 dl">−0.3</span><span class="ch">›</span></div>
<div class="st"><i class="tick" style="background:var(--social)"></i><b>SOCIAL</b><span class="v">20.1</span><span class="s12 dl">0.0</span><span class="ch">›</span></div>
<div class="st"><i class="tick" style="background:var(--discipline)"></i><b>DISCIPLINE</b><span class="v">27.6</span><span class="s12 dl">+0.9</span><span class="ch">›</span></div>
</div></div></div>
<nav>
<a class=""><span class="pi"><svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/></svg></span>Today</a>
<a class=""><span class="pi"><svg viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11M4 6h1M4 12h1M4 18h1"/></svg></span>Quests</a>
<a class="log"><span class="pi"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></span>Log</a>
<a class=""><span class="pi"><svg viewBox="0 0 24 24"><path d="M12 3l8 3v6c0 4.5-3.4 7.8-8 9-4.6-1.2-8-4.5-8-9V6z"/></svg></span>Arena</a>
<a class="on"><span class="pi"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-7 8-7s8 3 8 7"/></svg></span>Status</a>
</nav></body></html>
