# Render Blueprint for SYSTEM // SELF (HOLD H-02 ready option). Dashboard: New > Blueprint.
# Secrets are `sync: false`: Render prompts for them on first sync. MAIL_FROM is not prompted: it defaults to
# "SYSTEM // SELF <no-reply@systemself.app>" (env.ts); add it in the dashboard to send from another address.
databases:
  - name: system-self-db
    plan: basic-256mb
    postgresMajorVersion: "16"
    databaseName: system_self
    user: system_self

envVarGroups:
  # Groups accept only literal values (no sync: false / fromDatabase), so only NODE_ENV is shared.
  - name: system-self-shared
    envVars:
      - key: NODE_ENV
        value: production

services:
  - type: web
    name: system-self-api
    runtime: docker
    dockerfilePath: ./artifacts/api-server/Dockerfile
    dockerContext: .
    plan: starter
    numInstances: 1
    healthCheckPath: /api/readyz
    # Runs the bundled migrator (advisory-locked) before each deploy goes live. The entrypoint takes the role as $1.
    preDeployCommand: docker-entrypoint.sh migrate
    # SIGTERM to SIGKILL: 5 s readyz drain + 20 s in-flight cut-off (index.ts) fit inside.
    maxShutdownDelaySeconds: 30
    envVars:
      - fromGroup: system-self-shared
      - key: DATABASE_URL
        fromDatabase:
          name: system-self-db
          property: connectionString
      - key: JWT_SECRET
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: REVENUECAT_WEBHOOK_SECRET
        sync: false
      - key: REVENUECAT_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: EXPO_ACCESS_TOKEN
        sync: false
      - key: ROLE
        value: api
      - key: TRUST_PROXY
        value: "1"

  - type: worker
    name: system-self-worker
    runtime: docker
    dockerfilePath: ./artifacts/api-server/Dockerfile
    dockerContext: .
    plan: starter
    # The worker may deploy before the API: it needs the new schema too (the migrator is idempotent and locked).
    preDeployCommand: docker-entrypoint.sh migrate
    # The current tick finishes, then the worker exits; worker.ts forces an exit at 60 s.
    maxShutdownDelaySeconds: 75
    envVars:
      - fromGroup: system-self-shared
      - key: DATABASE_URL
        fromDatabase:
          name: system-self-db
          property: connectionString
      - key: JWT_SECRET
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: REVENUECAT_WEBHOOK_SECRET
        sync: false
      - key: REVENUECAT_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: EXPO_ACCESS_TOKEN
        sync: false
      - key: ROLE
        value: worker
