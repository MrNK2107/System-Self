# Production-like stack: postgres, one-shot migrate, two API instances behind nginx, one worker.
#   docker compose -f docker-compose.prod.yml up -d --build
# API through nginx: http://localhost:8080 ; direct: api1 on 3011, api2 on 3012.
# Setup:  cp .env.prod.example .env.prod   then edit it (every REPLACE value; the API refuses to start
# in production while JWT_SECRET / REVENUECAT_WEBHOOK_SECRET still look like placeholders).
# Keep POSTGRES_PASSWORD below in sync with DATABASE_URL in .env.prod.
name: system-self-prod

x-app: &app
  image: system-self-api:prod
  env_file: .env.prod
  restart: unless-stopped
  stop_grace_period: 30s

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: system_self
      POSTGRES_PASSWORD: example-db-password # CHANGE ME (and in DATABASE_URL)
      POSTGRES_DB: system_self
    volumes:
      - prod-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U system_self -d system_self"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  migrate:
    <<: *app
    build:
      context: .
      dockerfile: artifacts/api-server/Dockerfile
    environment:
      ROLE: migrate
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  api1: &api
    <<: *app
    environment:
      ROLE: api
    ports:
      - "3011:3001"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/readyz').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 10

  api2:
    <<: *api
    ports:
      - "3012:3001"

  worker:
    <<: *app
    environment:
      ROLE: worker
    depends_on:
      migrate:
        condition: service_completed_successfully

  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8080:80"
    depends_on:
      api1:
        condition: service_healthy
      api2:
        condition: service_healthy
    restart: unless-stopped

volumes:
  prod-pgdata:
